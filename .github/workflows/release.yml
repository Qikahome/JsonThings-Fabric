name: Release (manual)

# 手动触发：Actions → Release (manual) → Run workflow
# tag 填 v1.20.1-<mod_version>（如 v1.20.1-0.9.13+patch.1）才会创建 Release；
# 留空则只构建并上传 jar 作为 workflow artifact（不发 Release）。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（如 v1.20.1-0.9.13+patch.1）。留空 = 不发 Release，只上传构建产物'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew build
      - name: Upload jar (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: JsonThings-1.20.1-fabric
          path: build/libs/*.jar
      - name: Create GitHub Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: |
            build/libs/JsonThings-1.20.1-fabric-*.jar
            !build/libs/JsonThings-1.20.1-fabric-*-sources.jar
          generate_release_notes: true
