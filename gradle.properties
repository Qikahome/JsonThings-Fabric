# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ---- JsonThings Fabric (1.20.1) ----
# 本工程把上游 Forge 1.20.1（0.9.13）单工程直接改为 fabric-loom 单工程（不做多 gradle 模块）。
group = qikahome
mod_version = 0.9.13

minecraft_version = 1.20.1
fabric_loader_version = 0.17.2
fabric_api_version = 0.92.6+1.20.1
# Porting Lib：Fabric 侧 Forge API 兼容层（Create mc1.20.1/fabric/dev 同款版本），按模块 include 整包
# https://mvn.devos.one/releases/  io.github.fabricators_of_create.Porting-Lib:<module>:<version>
porting_lib_version = 2.3.13+1.20.1
# loom 版本写死在 build.gradle（插件版本必须是字面量）。1.20.1 钉 1.10.+，勿再升（Create 注：新版 loom 需更高 Java）
# parchment 与上游 Forge 侧一致（legacyforge 曾用 2023.09.03，loom 走 org.parchmentmc.data）
parchment_minecraft_version = 1.20.1
parchment_mappings_version = 2023.09.03

# loom 下载源镜像（maven.fabricmc.net / minecraft 资源在国内过慢；hanbings 为第三方全量代理，若失效可注释）
loom_libraries_base=https://repository.hanbings.io/proxy/
