# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ---- JsonThings Fabric (1.21.1) ----
# 本工程把上游官方 gigaherz JsonThings 1.21.1（0.13.7）单工程直接改为 fabric-loom 单工程
# （沿用 JsonThings-Fabric-1.20.1 移植路径；基线为 gigaherz 官方 1.21.1 分支 762367c，不含本地 fork 半成品 mcscript）。
group = qikahome
mod_version = 0.13.7+patch.3

minecraft_version = 1.21.1
fabric_loader_version = 0.17.2
fabric_api_version = 0.116.1+1.21.1
# Porting Lib：Fabric 侧 NeoForge API 兼容层。1.21.1 只有 beta 线（3.1.0-beta.x），发布在 devos snapshots
# 仓库（releases 仓库仅 1.20.1 的 2.3.x）。FluidType 等依赖由 FabricatedForgeFluid jar-in-jar 内嵌提供，
# 这里仅按模块 modImplementation 引入以提供编译期 classpath。
porting_lib_version = 3.1.0-beta.90+1.21.1
# loom 版本写死在 build.gradle（插件版本必须是字面量）。沿用 FFF-1.21.1 的 1.10.+ 与 Gradle 8.14(wrapper)
# parchment：1.21.1 无独立 parchment 数据，用 1.21 版（FFF-1.21.1 同款 2024.07.28）
parchment_minecraft_version = 1.21
parchment_mappings_version = 2024.07.28

# loom 下载源镜像（maven.fabricmc.net / minecraft 资源在国内过慢；hanbings 为第三方全量代理，若失效可注释）
loom_libraries_base=https://repository.hanbings.io/proxy/
