// JsonThings → Fabric (1.21.1) 单工程骨架
// 基线 = 官方 gigaherz JsonThings 1.21.1（0.13.7）；参考 JsonThings-Fabric-1.20.1 与 FabricatedForgeFluid-1.21.1：
// loom 1.10.+ 钉版 + Porting Lib 按模块 modImplementation。
// 源码沿用上游的 dev.gigaherz.jsonthings 包，mojmap + parchment 命名直接编译。
plugins {
    id 'fabric-loom' version '1.10.+'
    id 'maven-publish'
}

group = project.property('group')
version = project.property('mod_version')

base {
    archivesName = 'JsonThings-1.21.1-fabric'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    maven {
        // hanbings 第三方代理：镜像 fabricmc/mavenCentral 等，缓解国外源过慢（若失效可移除）
        url project.findProperty('loom_libraries_base') ?: 'https://repository.hanbings.io/proxy/'
    }
    maven {
        url 'https://maven.aliyun.com/repository/public'
        content {
            includeGroupByRegex '.*'
        }
    }
    mavenCentral()
    maven {
        // Minecraft 运行库（text2speech 等 Mojang 专属，仅发布于官方库）
        url "https://libraries.minecraft.net/"
    }
    maven {
        url "https://maven.fabricmc.net/"
    }
    maven {
        // Porting Lib 1.20.1 稳定线（2.3.x）
        url "https://mvn.devos.one/releases"
        content {
            includeGroup "io.github.fabricators_of_create.Porting-Lib"
        }
    }
    maven {
        // Porting Lib 1.21.1 beta 线（3.1.0-beta.x），发布在 devos snapshots 仓库
        url "https://mvn.devos.one/snapshots"
        content {
            includeGroup "io.github.fabricators_of_create.Porting-Lib"
        }
    }
    maven {
        // Porting Lib 模块的传递依赖（部分模块 → reach-entity-attributes）
        url "https://maven.jamieswhiteshirt.com/libs-release"
        content {
            includeGroup "com.jamieswhiteshirt"
        }
    }
    // parchment 数据（1.21 版数据，1.21.1 无独立 parchment）
    maven {
        url "https://maven.parchmentmc.org"
        content {
            includeGroupByRegex 'org\\.parchmentmc.*'
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        // 上游 NeoForge 的脚本引擎 rhino-lib（dev.gigaherz.rhinolib，gigaherz 自维护的 Rhino 再分发）
        url "https://www.dogforce-games.com/maven/"
        content {
            includeGroup "dev.gigaherz.rhinolib"
        }
    }
    maven {
        // FabricatedForgeFluid（流体系，GitHub Packages；1.21.1 版坐标 qikahome:FabricatedForgeFluid-1.21.1）
        url "https://maven.pkg.github.com/Qikahome/FabricatedForgeFluid"
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gpr.key") ?: System.getenv("GH_PACKAGES_TOKEN") ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.property('minecraft_version')}"
    // 与上游 NeoForge 侧同为 mojmap + parchment 命名，源码可直接编译
    mappings loom.layered {
        officialMojangMappings()
        parchment "org.parchmentmc.data:parchment-${project.property('parchment_minecraft_version')}:${project.property('parchment_mappings_version')}@zip"
    }
    modImplementation "net.fabricmc:fabric-loader:${project.property('fabric_loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.property('fabric_api_version')}"

    // Porting Lib 按模块 modImplementation（编译期 classpath）。运行时内嵌分两边：
    // fluids 由 FabricatedForgeFluid jar-in-jar 提供（同版本，避免重复内嵌），其余
    // （common=Lazy、item_abilities=ItemAbility/ItemAbilityItem、models=fluid_container
    // 桶模型 loader、registry=DeferredHolder）由本模组自行 include。
    def portingLibVersion = project.property('porting_lib_version')
    def portingLibModules = [
            'common', 'fluids', 'item_abilities', 'models', 'registry'
    ]
    def portingLibEmbed = [
            'common', 'item_abilities', 'models', 'registry'
    ]
    portingLibModules.each { mod ->
        modImplementation("io.github.fabricators_of_create.Porting-Lib:${mod}:${portingLibVersion}")
    }
    portingLibEmbed.each { mod ->
        modImplementation(include("io.github.fabricators_of_create.Porting-Lib:${mod}:${portingLibVersion}"))
    }

    // FabricatedForgeFluid 流体库（jar-in-jar 内嵌，自带 PL 与流体实体交互/渲染注册）
    modImplementation(include("qikahome:FabricatedForgeFluid-1.21.1:1.1.2"))

    // rhino-lib：上游 NeoForge 依赖的 Rhino 再分发（dev.gigaherz.rhinolib 包）。普通 Java 库，
    // 不绑任何加载器；TODO(发布)：需确认 jar-in-jar 内嵌加载方式（或发布时随 JsonThings 内嵌）。
    implementation(include("dev.gigaherz.rhinolib:rhino-lib:1.0.1"))

    compileOnly 'org.jetbrains:annotations:24.0.1'
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

loom {
    accessWidenerPath = file("src/main/resources/jsonthings.accesswidener")
    mixin {
        // 固定 refmap 名，不随 archivesName 变化；需与 jsonthings.mixins.json 的 "refmap" 一致，
        // 否则发布环境（intermediary）按此名找不到映射文件而崩溃。
        defaultRefmapName = "jsonthings.refmap.json"
    }

    runs {
        configureEach {
            runDir = 'run'
        }
        client {
            client()
        }
        server {
            server()
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = 'JsonThings-1.21.1-fabric'
            from components.java
        }
    }
    // 发布：publish.yml 在打 v1.21.1-* tag（或手动 dispatch）时推送到 GitHub Packages；
    // GitHub Release 由 release.yml 手动触发，与发布解耦。
    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/Qikahome/JsonThings-Fabric"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
