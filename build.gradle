// JsonThings → Fabric (1.20.1) 单工程骨架
// 参考 Create (mc1.20.1/fabric/dev) 与 AutoSizedGUI fabric 模块：loom 1.10.+ 钉版 + Porting Lib 整包 include。
plugins {
    id 'fabric-loom' version '1.10.+'
    id 'maven-publish'
}

group = project.property('group')
version = project.property('mod_version')

base {
    archivesName = 'JsonThings-1.20.1-fabric'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    maven {
        // hanbings 第三方代理：镜像 fabricmc/mavenCentral 等，缓解国外源过慢（若失效可移除）
        url project.findProperty('loom_libraries_base') ?: 'https://repository.hanbings.io/proxy/'
    }
    maven {
        url 'https://maven.aliyun.com/repository/public'
        content {
            includeGroupByRegex '.*'
        }
    }
    mavenCentral()
    maven {
        // Minecraft 运行库（text2speech 等 Mojang 专属，仅发布于官方库）
        url "https://libraries.minecraft.net/"
    }
    maven {
        url "https://maven.fabricmc.net/"
    }
    maven {
        // Porting Lib 发布仓库
        url "https://mvn.devos.one/releases"
        content {
            includeGroup "io.github.fabricators_of_create.Porting-Lib"
        }
    }
    maven {
        // Porting Lib 模块的传递依赖（attributes → reach-entity-attributes）
        url "https://maven.jamieswhiteshirt.com/libs-release"
        content {
            includeGroup "com.jamieswhiteshirt"
        }
    }
    // parchment 数据（与上游 Forge 侧一致的 1.20.1-2023.09.03）
    maven {
        url "https://maven.parchmentmc.org"
        content {
            includeGroupByRegex 'org\\.parchmentmc.*'
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        // Rhino Fabric 版官方发布（同 LatvianModder，与 KubeJS 1.20.1/fabric 同一依赖）
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        // FabricatedForgeFluid（本项目的流体库，GitHub Packages）
        url "https://maven.pkg.github.com/Qikahome/FabricatedForgeFluid"
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gpr.key") ?: System.getenv("GH_PACKAGES_TOKEN") ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.property('minecraft_version')}"
    // 与上游 Forge 侧同为 mojmap + parchment 命名，源码可直接编译
    mappings loom.layered {
        officialMojangMappings()
        parchment "org.parchmentmc.data:parchment-${project.property('parchment_minecraft_version')}:${project.property('parchment_mappings_version')}@zip"
    }
    modImplementation "net.fabricmc:fabric-loader:${project.property('fabric_loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.property('fabric_api_version')}"

    // Porting Lib 按模块 modImplementation（编译期 classpath）。运行时内嵌分两边：
    // fluids 由 FabricatedForgeFluid jar-in-jar 提供（同版本，避免重复内嵌），其余
    // （base=TierSortingRegistry、common=Lazy/NonNullSupplier、models=fluid_container
    // 桶模型 loader、tool_actions=ToolAction、transfer=FluidBucketWrapper）
    // 由本模组自行 include。
    def portingLibVersion = project.property('porting_lib_version')
    def portingLibModules = [
            'base', 'common', 'fluids', 'models', 'tool_actions', 'transfer'
    ]
    def portingLibEmbed = [
            'base', 'common', 'models', 'tool_actions', 'transfer'
    ]
    portingLibModules.each { mod ->
        modImplementation("io.github.fabricators_of_create.Porting-Lib:${mod}:${portingLibVersion}")
    }
    portingLibEmbed.each { mod ->
        modImplementation(include("io.github.fabricators_of_create.Porting-Lib:${mod}:${portingLibVersion}"))
    }

    // FabricatedForgeFluid 流体库（jar-in-jar 内嵌，自带 PL 与流体实体交互/渲染注册）
    modImplementation(include("qikahome:FabricatedForgeFluid-1.20.1:1.1.3"))

    compileOnly 'org.jetbrains:annotations:24.0.1'
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    // rhino 脚本引擎：上游 Forge 依赖 rhino mod（LatvianModder，modid=rhino）。这里引官方 Fabric 版
    // （1.20.1/fabric+quilt，2001.2.3-build.10），modImplementation 进 dev 运行时并走 loader 初始化。
    modImplementation 'maven.modrinth:rhino:2001.2.3-build.10+fabric'
}

loom {
    // AT → AW 迁移占位（内容见 jsonthings.accesswidener，按需启用）
    accessWidenerPath = file("src/main/resources/jsonthings.accesswidener")
    mixin {
        // 固定 refmap 名，不随 archivesName 变化；需与 jsonthings.mixins.json 的 "refmap" 一致
        defaultRefmapName = "jsonthings.refmap.json"
    }

    runs {
        configureEach {
            runDir = 'run'
        }
        client {
            client()
        }
        server {
            server()
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 上游部分（dev.gigaherz.jsonthings.*）为 BSD 3-Clause，本体新增部分为 MIT，两者都要求
// 二进制/源码再分发时随附许可与版权声明。jar-in-jar 时通知必须留在嵌套 jar 内部，故打进 jar。
tasks.named('jar', Jar) {
    from('LICENSE.txt') { into 'META-INF' }
}
tasks.named('sourcesJar', Jar) {
    from('LICENSE.txt') { into 'META-INF' }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = 'JsonThings-1.20.1-fabric'
            from components.java
        }
    }
    // 发布：publish.yml 在打 v1.20.1-* tag（或手动 dispatch）时推送到 GitHub Packages；
    // GitHub Release 由 release.yml 手动触发，与发布解耦。
    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/Qikahome/JsonThings-Fabric"
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
